<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <!-- Background atmospheric sunset gradient -->
    <linearGradient id="mascotSky" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#140F0A" />
      <stop offset="25%" stop-color="#311F13" />
      <stop offset="45%" stop-color="#805625" />
      <stop offset="65%" stop-color="#C99342" />
      <stop offset="80%" stop-color="#362214" />
      <stop offset="100%" stop-color="#110C08" />
    </linearGradient>

    <!-- Sun Halo Disk -->
    <radialGradient id="mascotSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="40%" stop-color="#E5AF52" />
      <stop offset="85%" stop-color="#8E571E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3A220F" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Mask Shader -->
    <linearGradient id="mascotMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#EBD5B7" />
      <stop offset="70%" stop-color="#9E8160" />
      <stop offset="100%" stop-color="#4A341E" />
    </linearGradient>

    <!-- Golden Highlight Rim -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8BA60" />
      <stop offset="50%" stop-color="#A67832" />
      <stop offset="100%" stop-color="#422C13" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="600" height="900" fill="#140E0A" />
  <rect width="600" height="900" fill="url(#mascotSky)" opacity="0.9" />

  <!-- Giant Halo Sun Behind the Hero Head -->
  <circle cx="300" cy="360" r="220" fill="url(#mascotSun)" opacity="0.85" />

  <!-- Background Gopuram Temple Silhouette (Left) -->
  <g fill="#17110B" opacity="0.85">
    <path d="M 40 580 L 45 540 L 52 540 L 55 500 L 62 500 L 65 460 L 72 460 L 75 430 L 80 430 L 83 400 L 88 400 L 90 380 L 94 380 L 96 365 L 98 365 L 98 350 L 100 350 L 100 365 L 102 365 L 104 380 L 108 380 L 110 400 L 115 400 L 118 430 L 123 430 L 126 460 L 133 460 L 136 500 L 143 500 L 146 540 L 153 540 L 160 580 Z" />
    <circle cx="99" cy="347" r="2.5" fill="#C99A45" />
  </g>

  <!-- Distant City Skyline & Gopurams (Right) -->
  <g fill="#1B130D" opacity="0.75">
    <path d="M 460 580 L 465 530 L 475 530 L 480 490 L 490 490 L 495 470 L 500 470 L 500 455 L 504 455 L 504 470 L 509 470 L 514 490 L 524 490 L 529 530 L 539 530 L 545 580 Z" />
    <!-- City block towers -->
    <rect x="545" y="520" width="22" height="60" />
    <rect x="567" y="500" width="18" height="80" />
    <rect x="585" y="535" width="15" height="45" />
  </g>

  <!-- River Bridge Arch Line in Mid-ground -->
  <g>
    <rect x="0" y="580" width="600" height="10" fill="#201710" />
    <!-- Bridge arches -->
    <path d="M 0 590 Q 25 590 35 605 L 50 605 Q 60 590 85 590 L 85 605 Q 110 590 135 605 L 150 605 Q 160 590 185 590 L 185 605 Q 210 590 235 605 L 450 605 Q 465 590 490 590 L 490 605 Q 515 590 540 605 L 600 605 L 600 590 Z" fill="#140E0A" />
    <!-- Water reflections -->
    <rect x="0" y="590" width="600" height="310" fill="#18110B" opacity="0.9" />
    <ellipse cx="300" cy="620" rx="160" ry="6" fill="#C99A45" opacity="0.4" />
    <ellipse cx="300" cy="650" rx="190" ry="7" fill="#E6C99A" opacity="0.3" />
    <ellipse cx="300" cy="685" rx="140" ry="6" fill="#8C5C21" opacity="0.25" />
  </g>

  <!-- ================= THE MASCOT CHARACTER ================= -->
  <!-- Legs / Cargo Pants -->
  <g fill="#16120E">
    <path d="M 180 620 L 140 850 L 160 900 L 285 900 L 290 670 Z" />
    <path d="M 420 620 L 460 850 L 440 900 L 315 900 L 310 670 Z" />
    <!-- Tactical Cargo Pockets -->
    <rect x="150" y="720" width="65" height="85" rx="4" fill="#1C1611" stroke="#38291A" stroke-width="2" />
    <rect x="145" y="712" width="75" height="16" rx="2" fill="#241B12" />
    <!-- Straps with gold buckle -->
    <rect x="180" y="732" width="8" height="70" fill="#C99A45" opacity="0.7" />

    <rect x="385" y="720" width="65" height="85" rx="4" fill="#1C1611" stroke="#38291A" stroke-width="2" />
    <rect x="380" y="712" width="75" height="16" rx="2" fill="#241B12" />
    <rect x="412" y="732" width="8" height="70" fill="#C99A45" opacity="0.7" />
  </g>

  <!-- Torso & T-Shirt Base -->
  <g>
    <!-- Black t-shirt inside open hoodie -->
    <path d="M 230 330 L 370 330 L 390 620 L 210 620 Z" fill="#110D09" />
    <!-- Gold text on t-shirt: "VYRA" and "GAMES" -->
    <text x="300" y="420" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="700" letter-spacing="6" fill="#F6ECDD" text-anchor="middle">VYRA</text>
    <line x1="240" y1="432" x2="270" y2="432" stroke="#C99A45" stroke-width="2" />
    <text x="300" y="437" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="600" letter-spacing="4" fill="#C99A45" text-anchor="middle">GAMES</text>
    <line x1="330" y1="432" x2="360" y2="432" stroke="#C99A45" stroke-width="2" />
  </g>

  <!-- Open Tactical Streetwear Hoodie Jacket -->
  <g fill="#18130E">
    <!-- Left Jacket Half & Arm -->
    <path d="M 230 310 L 190 350 L 140 450 L 125 580 L 180 640 L 230 620 L 250 360 Z" />
    <!-- Left Arm highlight rim -->
    <path d="M 125 580 L 140 450 L 190 350" fill="none" stroke="url(#goldRim)" stroke-width="3" opacity="0.8" />
    
    <!-- Right Jacket Half & Arm -->
    <path d="M 370 310 L 410 350 L 460 450 L 475 580 L 420 640 L 370 620 L 350 360 Z" />
    <!-- Right Arm highlight rim -->
    <path d="M 475 580 L 460 450 L 410 350" fill="none" stroke="url(#goldRim)" stroke-width="3" opacity="0.8" />

    <!-- Sleeve Emblem Patch on Right Shoulder -->
    <polygon points="445,385 470,385 457.5,415" fill="#130E09" stroke="#C99A45" stroke-width="2" />
    <text x="457.5" y="405" font-family="'Cinzel', serif" font-size="14" font-weight="800" fill="#E6C99A" text-anchor="middle">V</text>

    <!-- Tactical Zipper Tracks & Gold Hardware -->
    <line x1="250" y1="360" x2="230" y2="620" stroke="#C99A45" stroke-width="2.5" />
    <line x1="350" y1="360" x2="370" y2="620" stroke="#C99A45" stroke-width="2.5" />
  </g>

  <!-- Tactical Belt & Hands in Pockets -->
  <g>
    <!-- Tactical Hands positioned inside pockets -->
    <path d="M 160 570 Q 145 610 185 640 Q 210 630 200 580 Z" fill="#15100B" />
    <path d="M 440 570 Q 455 610 415 640 Q 390 630 400 580 Z" fill="#15100B" />
    <!-- Smartwatch on left wrist -->
    <rect x="180" y="585" width="20" height="10" rx="2" fill="#2E2317" stroke="#C99A45" stroke-width="1.5" />
    <!-- Hanging tactical strap -->
    <rect x="310" y="610" width="8" height="60" fill="#C99A45" />
  </g>

  <!-- Hoodie Collar & Neck Shade -->
  <g>
    <path d="M 220 320 Q 210 260 240 230 Q 300 245 360 230 Q 390 260 380 320 Z" fill="#130D08" stroke="#382819" stroke-width="2" />
  </g>

  <!-- ================= THE SIGNATURE 'V' HELMET / MASK ================= -->
  <g filter="url(#glow)">
    <!-- Dark Neck Base -->
    <path d="M 270 240 L 330 240 L 320 280 L 280 280 Z" fill="#0E0A06" />

    <!-- Sculptural Geometric V Helmet / Mask -->
    <!-- Left Face of V with Temple Inside -->
    <polygon points="215,90 295,90 350,260 325,275 270,170" fill="url(#mascotMask)" stroke="#1F1710" stroke-width="2" />

    <!-- Interior Window Cutout in Left Blade of Mask -->
    <clipPath id="maskClip">
      <polygon points="220,95 290,95 340,250 320,265 275,170" />
    </clipPath>
    <g clip-path="url(#maskClip)">
      <rect x="210" y="80" width="140" height="200" fill="#DCA857" />
      <circle cx="265" cy="120" r="30" fill="#FFF2CE" />
      <!-- Mini temple tower silhouette inside mask! -->
      <path d="M 250 165 L 255 145 L 260 145 L 262 130 L 267 130 L 269 120 L 271 120 L 271 112 L 273 112 L 273 120 L 275 120 L 277 130 L 282 130 L 284 145 L 289 145 L 294 165 Z" fill="#17110A" />
      <rect x="235" y="165" width="80" height="6" fill="#291E13" />
      <path d="M 235 171 Q 248 171 254 180 L 264 180 Q 270 171 283 171 Z" fill="#17110A" />
      <!-- Birds inside mask -->
      <path d="M 275 105 Q 278 100 281 105 Q 284 100 287 105 Z" fill="#18110A" />
    </g>

    <!-- Right Angular Razor Blade of Mask -->
    <polygon points="325,275 350,150 435,70 410,135 425,145 385,190 325,275" fill="#171109" />
    <!-- Silver-Gold Bevel Facet on Right Blade -->
    <polygon points="325,270 348,155 425,80 405,140 380,190 325,270" fill="url(#mascotMask)" />
    <!-- Feathered Wing Accent Cuts on Top-Right -->
    <polygon points="435,70 415,105 430,112" fill="#FFFFFF" opacity="0.9" />
    <polygon points="418,125 395,160 410,165" fill="#EBD2B2" />

    <!-- Razor Center Bevel Highlight Line -->
    <line x1="325" y1="275" x2="425" y2="78" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" />
  </g>
</svg>
