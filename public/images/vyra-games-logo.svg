<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background antique parchment gradient -->
    <radialGradient id="skyGlow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#F2D398" />
      <stop offset="35%" stop-color="#D4A75E" />
      <stop offset="65%" stop-color="#916533" />
      <stop offset="100%" stop-color="#1F1710" />
    </radialGradient>

    <!-- Golden Sun Disk -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2CE" />
      <stop offset="50%" stop-color="#E2B258" />
      <stop offset="85%" stop-color="#C28732" />
      <stop offset="100%" stop-color="#915B1E" stop-opacity="0.9" />
    </radialGradient>

    <!-- Metallic V bevel gradient -->
    <linearGradient id="vMetalLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5ECE0" />
      <stop offset="30%" stop-color="#DAC7AD" />
      <stop offset="70%" stop-color="#9C8366" />
      <stop offset="100%" stop-color="#4E3D2C" />
    </linearGradient>

    <linearGradient id="vMetalRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#EBDBC7" />
      <stop offset="60%" stop-color="#B09778" />
      <stop offset="100%" stop-color="#5C4731" />
    </linearGradient>

    <!-- Wordmark metallic gradient -->
    <linearGradient id="goldWordmark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F3E5D0" />
      <stop offset="60%" stop-color="#C5A475" />
      <stop offset="85%" stop-color="#84653B" />
      <stop offset="100%" stop-color="#4A341A" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="deepShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="800" height="800" fill="#17130F" />
  <rect width="800" height="800" fill="url(#skyGlow)" opacity="0.92" />

  <!-- Textured Vignette Frame -->
  <rect width="800" height="800" fill="none" stroke="#332417" stroke-width="8" opacity="0.6" />

  <!-- Ancient Temple Pillar Foreground (Left) -->
  <g opacity="0.85">
    <path d="M 0 0 L 80 0 L 75 140 L 95 160 L 85 240 L 65 320 L 75 480 L 100 520 L 80 800 L 0 800 Z" fill="#15100B" />
    <!-- Pillar carvings relief -->
    <path d="M 15 120 L 65 120 L 70 145 L 20 145 Z" fill="#291F16" />
    <path d="M 15 220 L 75 220 L 70 250 L 18 250 Z" fill="#291F16" />
    <path d="M 20 380 L 65 380 L 68 440 L 18 440 Z" fill="#291F16" />
  </g>

  <!-- Golden Sun Disk in Sky -->
  <circle cx="460" cy="280" r="165" fill="url(#sunGlow)" filter="url(#softGlow)" opacity="0.95" />

  <!-- Birds in Distance -->
  <path d="M 420 220 Q 425 214 430 220 Q 435 214 440 220 Q 432 216 420 220 Z" fill="#1D1610" opacity="0.75" />
  <path d="M 460 235 Q 464 230 468 235 Q 472 230 476 235 Q 470 232 460 235 Z" fill="#1D1610" opacity="0.65" />
  <path d="M 485 250 Q 490 244 496 250 Q 502 244 508 250 Q 498 246 485 250 Z" fill="#1D1610" opacity="0.8" />

  <!-- Distant Gopuram Silhouettes on Horizon -->
  <g fill="#211912" opacity="0.9">
    <!-- Far Right Gopuram 1 -->
    <path d="M 640 450 L 643 425 L 647 425 L 648 405 L 652 405 L 653 385 L 655 385 L 655 370 L 657 370 L 657 385 L 659 385 L 660 405 L 664 405 L 665 425 L 669 425 L 672 450 Z" />
    <!-- Far Right Gopuram 2 -->
    <path d="M 720 450 L 724 415 L 728 415 L 730 390 L 733 390 L 734 375 L 736 375 L 736 360 L 738 360 L 738 375 L 740 375 L 742 390 L 744 390 L 748 415 L 752 450 Z" />
    <!-- Center-Left Background Temple -->
    <path d="M 270 450 L 275 410 L 280 410 L 282 380 L 287 380 L 290 350 L 295 350 L 297 335 L 299 335 L 299 320 L 301 320 L 301 335 L 303 335 L 305 350 L 310 350 L 313 380 L 318 380 L 322 410 L 328 450 Z" />
  </g>

  <!-- Grand Left Main Gopuram Tower (Madurai/Thanjavur Style) -->
  <g fill="#17120D">
    <path d="M 95 450 L 105 400 L 115 400 L 118 360 L 128 360 L 132 320 L 140 320 L 143 285 L 150 285 L 153 255 L 158 255 L 160 230 L 165 230 L 167 210 L 172 210 L 174 190 L 177 190 L 177 175 L 180 175 L 180 190 L 183 190 L 185 210 L 190 210 L 192 230 L 197 230 L 199 255 L 204 255 L 207 285 L 214 285 L 217 320 L 225 320 L 229 360 L 239 360 L 243 400 L 253 400 L 265 450 Z" />
    <!-- Gopuram Tier Details -->
    <rect x="120" y="360" width="118" height="6" fill="#3D2E20" opacity="0.7" />
    <rect x="133" y="320" width="92" height="5" fill="#3D2E20" opacity="0.7" />
    <rect x="144" y="285" width="70" height="4" fill="#3D2E20" opacity="0.7" />
    <rect x="154" y="255" width="50" height="4" fill="#3D2E20" opacity="0.7" />
    <rect x="162" y="230" width="35" height="3" fill="#3D2E20" opacity="0.7" />
    <!-- Kalasam Spire Top -->
    <circle cx="178.5" cy="172" r="3" fill="#C99A45" />
    <circle cx="178.5" cy="166" r="2" fill="#E6C99A" />
  </g>

  <!-- Ancient Arched Stone Bridge across the River -->
  <g fill="#1D1610">
    <!-- Bridge Roadway -->
    <rect x="70" y="445" width="730" height="12" fill="#251C14" />
    <line x1="70" y1="445" x2="800" y2="445" stroke="#C99A45" stroke-width="1.5" opacity="0.7" />
    <!-- Arches -->
    <path d="M 270 457 Q 295 457 305 470 L 320 470 Q 330 457 355 457 L 355 470 Q 380 457 405 470 L 420 470 Q 430 457 455 457 L 455 470 Q 480 457 505 470 L 520 470 Q 530 457 555 457 L 555 470 Q 580 457 605 470 L 620 470 Q 630 457 655 457 L 655 470 Q 680 457 705 470 L 720 470 Q 730 457 755 457 L 755 470 L 800 470 L 800 457 Z" fill="#16100B" />
  </g>

  <!-- River Water Surface and Golden Sun Reflections -->
  <g>
    <!-- Water base dark sepia -->
    <rect x="0" y="457" width="800" height="150" fill="#241B13" opacity="0.95" />
    <!-- Shimmering reflection bands -->
    <ellipse cx="440" cy="470" rx="140" ry="4" fill="#C99A45" opacity="0.7" />
    <ellipse cx="450" cy="482" rx="170" ry="5" fill="#E6C99A" opacity="0.8" />
    <ellipse cx="435" cy="496" rx="190" ry="5" fill="#F3DEAF" opacity="0.85" />
    <ellipse cx="445" cy="512" rx="210" ry="6" fill="#C99A45" opacity="0.7" />
    <ellipse cx="430" cy="528" rx="180" ry="5" fill="#A87A38" opacity="0.6" />
    <ellipse cx="440" cy="545" rx="150" ry="4" fill="#785324" opacity="0.5" />
    <ellipse cx="450" cy="565" rx="110" ry="4" fill="#5E3F1A" opacity="0.4" />
  </g>

  <!-- Foreground Ancient Stepped Ghat Stones (Bottom Right) -->
  <g fill="#140E0A">
    <rect x="670" y="660" width="130" height="40" />
    <rect x="690" y="630" width="110" height="30" />
    <rect x="720" y="605" width="80" height="25" />
    <!-- Stone edge highlights -->
    <line x1="670" y1="660" x2="800" y2="660" stroke="#79542D" stroke-width="2" opacity="0.7" />
    <line x1="690" y1="630" x2="800" y2="630" stroke="#79542D" stroke-width="2" opacity="0.7" />
    <line x1="720" y1="605" x2="800" y2="605" stroke="#79542D" stroke-width="2" opacity="0.7" />
  </g>

  <!-- ================= MASTER EMBLEM: THE SCULPTED 'V' ================= -->
  <g filter="url(#deepShadow)">
    <!-- Outer Dark Silhouette Border / Inset Frame of V -->
    <polygon points="210,150 345,150 435,470 420,590 340,360 210,150" fill="#18120C" />
    
    <!-- Left Wing of V (Contains Cutout of Sun & Temple) -->
    <path d="M 210 150 L 345 150 L 418 430 L 380 430 L 265 195 L 210 150 Z" fill="url(#vMetalLeft)" />
    
    <!-- Interior Vignette Inside Left Wing -->
    <clipPath id="leftVClip">
      <polygon points="215,155 340,155 410,420 380,420 270,200" />
    </clipPath>
    <g clip-path="url(#leftVClip)">
      <rect x="210" y="150" width="220" height="280" fill="#DDB065" />
      <circle cx="310" cy="200" r="50" fill="#FFF4D4" opacity="0.9" />
      <!-- Silhouetted mini temple inside V -->
      <path d="M 285 240 L 290 215 L 295 215 L 297 195 L 302 195 L 304 180 L 307 180 L 307 170 L 309 170 L 309 180 L 312 180 L 314 195 L 319 195 L 321 215 L 326 215 L 330 240 Z" fill="#201710" />
      <rect x="260" y="240" width="100" height="8" fill="#291F16" />
      <!-- Mini bridge arches -->
      <path d="M 260 248 Q 275 248 280 258 L 290 258 Q 295 248 310 248 L 320 258 Q 325 248 340 248 L 340 258 Z" fill="#1C140D" />
      <rect x="260" y="258" width="100" height="30" fill="#996D31" opacity="0.7" />
    </g>

    <!-- Right Wing of V (Dynamic Sharp Beveled Blade / Wing) -->
    <polygon points="420,590 395,400 685,70 655,160 675,175 625,230 645,245 420,590" fill="#17120C" />
    
    <!-- Front Beveled Facet of Right Wing -->
    <polygon points="420,580 400,410 670,85 645,165 615,230 420,580" fill="url(#vMetalRight)" />
    
    <!-- Feathered Wing Accent Cuts on Top-Right -->
    <polygon points="685,70 660,115 678,125" fill="#EAD9C4" />
    <polygon points="665,140 635,185 650,195" fill="#D6BF9F" />
    <polygon points="635,210 605,255 620,265" fill="#BFA37E" />

    <!-- Sharp Center Spine Divider of the V -->
    <line x1="420" y1="585" x2="665" y2="80" stroke="#FFFFFF" stroke-width="3" opacity="0.8" />
  </g>

  <!-- ================= VYRA GAMES WORDMARK ================= -->
  <!-- "VYRA" sculpted monumental display letterforms -->
  <g filter="url(#deepShadow)">
    <!-- V -->
    <path d="M 140 600 L 195 600 L 255 700 L 257 700 L 315 600 L 370 600 L 285 730 L 225 730 Z" fill="url(#goldWordmark)" stroke="#2B1E13" stroke-width="2" />
    <!-- Bevel highlights on V -->
    <path d="M 140 600 L 195 600 L 256 700 L 225 730 Z" fill="#FFFFFF" opacity="0.18" />

    <!-- Y -->
    <path d="M 360 600 L 415 600 L 452 660 L 490 600 L 545 600 L 480 690 L 480 730 L 425 730 L 425 690 Z" fill="url(#goldWordmark)" stroke="#2B1E13" stroke-width="2" />
    <path d="M 360 600 L 415 600 L 452 660 L 425 690 Z" fill="#FFFFFF" opacity="0.18" />

    <!-- R -->
    <path d="M 535 600 L 630 600 Q 675 600 675 640 Q 675 668 640 678 L 685 730 L 630 730 L 595 685 L 580 685 L 580 730 L 535 730 Z M 580 628 L 580 660 L 620 660 Q 635 660 635 644 Q 635 628 620 628 Z" fill="url(#goldWordmark)" stroke="#2B1E13" stroke-width="2" />
    <path d="M 535 600 L 580 600 L 580 730 L 535 730 Z" fill="#FFFFFF" opacity="0.18" />

    <!-- A -->
    <path d="M 665 730 L 725 600 L 780 600 L 840 730 L 785 730 L 772 700 L 732 700 L 720 730 Z M 740 670 L 764 670 L 752 635 Z" transform="translate(-140, 0)" fill="url(#goldWordmark)" stroke="#2B1E13" stroke-width="2" />
  </g>

  <!-- "G A M E S" Tracked Typography with Dagger Separators -->
  <g>
    <!-- Left Dagger / Spear Line -->
    <path d="M 140 755 L 285 755 L 305 757 L 285 759 L 140 759 L 130 757 Z" fill="#C99A45" />
    
    <!-- GAMES Text -->
    <text x="400" y="763" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="700" letter-spacing="14" fill="#E6C99A" text-anchor="middle">GAMES</text>
    
    <!-- Right Dagger / Spear Line -->
    <path d="M 660 755 L 515 755 L 495 757 L 515 759 L 660 759 L 670 757 Z" fill="#C99A45" />
  </g>

  <!-- Tagline Banner: "STORIES PLAY FOREVER" -->
  <g transform="translate(400, 788)">
    <!-- Dark embossed pill/stone container -->
    <rect x="-190" y="-14" width="380" height="24" rx="12" fill="#130D08" stroke="#79542D" stroke-width="1.5" />
    <text x="0" y="2" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="600" letter-spacing="4" fill="#C99A45" text-anchor="middle">STORIES PLAY FOREVER</text>
  </g>
</svg>
